services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amigos
      POSTGRES_USER: amigos
      POSTGRES_PASSWORD: amigos_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigos -d amigos"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - amigos_postgres_data:/var/lib/postgresql/data

volumes:
  amigos_postgres_data:
