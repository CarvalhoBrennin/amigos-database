name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://amigos:amigos_ci_only@127.0.0.1:5432/amigos
      TEST_DATABASE_URL: postgresql://amigos:amigos_ci_only@127.0.0.1:5432/amigos
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amigos
          POSTGRES_USER: amigos
          POSTGRES_PASSWORD: amigos_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amigos -d amigos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Verify reference seed is idempotent
        run: npm run db:seed

      - name: Run quality gate
        run: npm run check

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://amigos:amigos_ci_only@127.0.0.1:5432/amigos
      TEST_DATABASE_URL: postgresql://amigos:amigos_ci_only@127.0.0.1:5432/amigos
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amigos
          POSTGRES_USER: amigos
          POSTGRES_PASSWORD: amigos_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amigos -d amigos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
